name: Update stores.json

# 매일 KST 08:00 (UTC 23:00 전날)에 자동 실행 + 수동 실행 가능
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape stores
        run: node scripts/scrape-stores.mjs

      - name: Commit & push if changed
        env:
          TZ: Asia/Seoul
        run: |
          if [[ -z $(git status --porcelain public/stores.json) ]]; then
            echo "No changes in stores.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stores.json
          git commit -m "chore: update stores.json ($(date '+%Y-%m-%d %H:%M %Z'))"
          git push
